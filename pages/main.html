<section class="main-dashboard page">
  <div class="ep-top-status-line" id="epTopStatusLine" data-status="pro" data-ai="admin_api" data-subscription-status>
    <div class="ep-top-status-left" data-subscription-summary>С ИИ · 491д</div>
    <div class="ep-top-status-right" data-ai-status>ИИ вкл.</div>
  </div>

  <div class="page-head">
    <h1>Главный экран</h1>
    <p>Быстрый рабочий пульт мастера. Визуальная архитектура готова.</p>
  </div>

  <div class="grid grid-3">
    <button class="card tile module-shield ep-clickable" type="button" data-route="shield">
      <div class="tile-icon">🛡️</div>
      <h3>Конфигуратор щита</h3>
      <p>Автоматика, корпус, расходка, работы.</p>
    </button>

    <button class="card tile module-pool ep-clickable" type="button" data-route="pool">
      <div class="tile-icon">🔌</div>
      <h3>Пул розеток/штроб</h3>
      <p>Розетки, выключатели, трассы, коробки.</p>
    </button>

    <button class="card tile module-picker ep-clickable" type="button" data-route="materials" data-ep27-pick="material" data-ep27-db-picker="material">
      <div class="tile-icon">🗂️</div>
      <h3>Материалы</h3>
      <p>Материалы из активной базы.</p>
    </button>

    <button class="card tile module-picker ep-clickable" type="button" data-route="work" data-ep27-pick="work" data-ep27-db-picker="work">
      <div class="tile-icon">🧰</div>
      <h3>Работа</h3>
      <p>Работы из активной базы.</p>
    </button>

    <button class="card tile module-estimate ep-clickable" type="button" data-route="estimate">
      <div class="tile-icon">📋</div>
      <h3>Смета</h3>
      <p>Суммирование, экспорт, черновики.</p>
    </button>

    <button class="card tile module-documents ep-clickable" type="button" data-route="details">
      <div class="tile-icon">📦</div>
      <h3>Детализация материалов</h3>
      <p>Список для закупки и поставщика.</p>
    </button>
    <button class="card tile module-profile ep-clickable" type="button" data-route="profile">
      <div class="tile-icon"></div>
      <h3>Профиль и реквизиты</h3>
      <p>Данные мастера и клиента для документов.</p>
    </button>
    <button class="card tile module-documents ep-clickable" type="button" data-route="documents">
      <div class="tile-icon"></div>
      <h3>Документы</h3>
      <p>Смета заказчику, договор, акт, счёт.</p>
    </button>
  </div>

  <div class="card estimate-card">
    <h3>Предварительная смета</h3>
    <p class="badge" data-est-badge>Пока пусто</p>
    <p>Нажми «Материалы» или «Работа», выбери позиции плюсиками — они появятся здесь.</p>
    <div class="ep-est-list" data-est-list></div>
    <div class="grid grid-3">
      <button class="btn btn-primary ep-clickable" type="button" data-est-open>Открыть черновик</button>
      <button class="btn btn-ghost ep-clickable" type="button" data-est-clear>Очистить</button>
      <button class="btn btn-primary ep-clickable" type="button" data-est-save>Сохранить</button>
    </div>
  </div>
</section>
