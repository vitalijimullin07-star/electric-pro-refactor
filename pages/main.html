<section class="main-ai-strip" aria-label="Статус подписки и ИИ">
  <span>С ИИ · 491д</span>
  <span>ИИ вкл.</span>
</section>

<section class="main-head">
  <h1>Главный экран</h1>
  <p>Быстрый рабочий пульт мастера. Визуальная архитектура готова.</p>
</section>

<section class="main-dashboard-grid">
  <button class="tile glass ep-clickable module-shield" type="button" data-route="shield">
    <div class="tile-icon">🛡️</div>
    <h3>Конфигуратор щита</h3>
    <p>Автоматика, корпус, расходка, работы.</p>
  </button>

  <button class="tile glass ep-clickable module-pool" type="button" data-route="pool">
    <div class="tile-icon">🔌</div>
    <h3>Пул розеток/штроб</h3>
    <p>Розетки, выключатели, трассы, коробки.</p>
  </button>

  <button class="tile glass ep-clickable module-database" type="button" data-route="materials">
    <div class="tile-icon">🗂️</div>
    <h3>Материалы</h3>
    <p>Материалы из активной базы.</p>
  </button>

  <button class="tile glass ep-clickable module-database" type="button" data-route="work">
    <div class="tile-icon">🧰</div>
    <h3>Работа</h3>
    <p>Работы из активной базы.</p>
  </button>

  <button class="tile glass ep-clickable module-estimate" type="button" data-route="estimate">
    <div class="tile-icon">📋</div>
    <h3>Смета</h3>
    <p>Суммирование, экспорт, черновики.</p>
  </button>

  <button class="tile glass ep-clickable module-documents" type="button" data-route="database">
    <div class="tile-icon">📦</div>
    <h3>Детализация материалов</h3>
    <p>Список для закупки и поставщика.</p>
  </button>
</section>

<section class="estimate-preview glass">
  <h2>Предварительная смета</h2>
  <div class="status-pill">Пока пусто</div>
  <p>Нажми «Материалы» или «Работа», выбери позиции плюсиками — они появятся здесь.</p>
  <div class="estimate-actions">
    <button class="btn btn-primary ep-clickable" type="button" data-route="estimate">Открыть черновик</button>
    <button class="btn btn-ghost ep-clickable" type="button">Очистить</button>
  </div>
</section>
