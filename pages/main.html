<section class="main-dashboard">
  <div class="main-status-row" data-subscription-status>
    <div class="main-status-pill grow" data-subscription-summary>С ИИ · 491д</div>
    <div class="main-status-pill" data-ai-status>ИИ вкл.</div>
  </div>

  <div class="main-title-block">
    <h1>Главный экран</h1>
    <p>Быстрый рабочий пульт мастера. Визуальная архитектура готова.</p>
  </div>

  <div class="main-grid">
    <button class="main-card" type="button" data-route="shield">
      <span class="main-card-icon">🛡️</span>
      <h3 class="main-card-title">Конфигуратор щита</h3>
      <p class="main-card-note">Автоматика, корпус, расходка, работы.</p>
    </button>

    <button class="main-card" type="button" data-route="pool">
      <span class="main-card-icon">🔌</span>
      <h3 class="main-card-title">Пул розеток/штроб</h3>
      <p class="main-card-note">Розетки, выключатели, трассы, коробки.</p>
    </button>

    <button class="main-card" type="button" data-route="materials">
      <span class="main-card-icon">🗂️</span>
      <h3 class="main-card-title">Материалы</h3>
      <p class="main-card-note">Материалы из активной базы.</p>
    </button>

    <button class="main-card" type="button" data-route="work">
      <span class="main-card-icon">💼</span>
      <h3 class="main-card-title">Работа</h3>
      <p class="main-card-note">Работы из активной базы.</p>
    </button>

    <button class="main-card" type="button" data-route="estimate">
      <span class="main-card-icon">📋</span>
      <h3 class="main-card-title">Смета</h3>
      <p class="main-card-note">Суммирование, экспорт, черновики.</p>
    </button>

    <button class="main-card" type="button" data-route="details">
      <span class="main-card-icon">📦</span>
      <h3 class="main-card-title">Детализация материалов</h3>
      <p class="main-card-note">Список для закупки и поставщика.</p>
    </button>
  </div>

  <section class="estimate-preview">
    <h2>Предварительная смета</h2>
    <span class="estimate-empty-pill">Пока пусто</span>
    <p>Нажми «Материалы» или «Работа», выбери позиции плюсиками — они появятся здесь.</p>
    <div class="estimate-actions">
      <button class="estimate-action primary" type="button">Открыть черновик</button>
      <button class="estimate-action secondary" type="button">Очистить</button>
    </div>
  </section>
</section>
