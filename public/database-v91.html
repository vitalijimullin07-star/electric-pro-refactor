<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Electric PRO — Новая база V91</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
    .top{position:sticky;top:0;background:#111827;color:white;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .title{font-size:16px;font-weight:900}
    .sub{font-size:11px;opacity:.72;margin-top:2px}
    button{border:0;border-radius:14px;padding:12px;font-weight:900}
    .back{background:#374151;color:white}
    .wrap{padding:12px;max-width:760px;margin:0 auto}
    .card{background:white;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .pill{background:#ecfdf5;color:#065f46;border-radius:14px;padding:12px;font-weight:900;margin:8px 0}
    .blue{background:#2563eb;color:white}
    .green{background:#059669;color:white}
    .red{background:#dc2626;color:white}
    pre{background:#111827;color:#d1d5db;border-radius:16px;padding:12px;overflow:auto;font-size:12px;max-height:360px}
  </style>
</head>
<body>
  <div class="top">
    <div>
      <div class="title">Новая база V91</div>
      <div class="sub">чистое ядро · старая база отключена</div>
    </div>
    <button class="back" id="backBtn">Назад</button>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="pill">Старая база отключена. Новая база пустая.</div>
      <div class="grid">
        <button class="green" id="myBtn">Моя база</button>
        <button class="blue" id="serverBtn">База сервера</button>
      </div>
      <p>Следующий шаг — создать новую «Мою базу» как файловый менеджер, потом новую «Базу сервера».</p>
    </div>

    <div class="card">
      <b>Текущее состояние:</b>
      <pre id="stateOut"></pre>
      <button class="red" id="resetBtn">Очистить новое ядро</button>
    </div>
  </div>

<script>
(function(){
  const STATE_KEY = "EP_DB_STATE_V91";

  function emptyState(){
    return {
      version: "V91_CLEAN_DATABASE_CORE",
      activeScope: "my",
      role: "master",
      server: { materials: [], works: [] },
      my: { materials: [], works: [] },
      proposals: [],
      updatedAt: Date.now()
    };
  }

  function readState(){
    try {
      return JSON.parse(localStorage.getItem(STATE_KEY)) || emptyState();
    } catch(e) {
      return emptyState();
    }
  }

  function saveState(state){
    state.updatedAt = Date.now();
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  }

  function render(){
    document.getElementById("stateOut").textContent = JSON.stringify(readState(), null, 2);
  }

  document.getElementById("backBtn").onclick = () => {
    if (history.length > 1) history.back();
    else location.href = "index.html?v=v91-clean-db-start";
  };

  document.getElementById("myBtn").onclick = () => {
    const s = readState();
    s.activeScope = "my";
    saveState(s);
    render();
    alert("Активна: Моя база. Редактор создадим следующим шагом.");
  };

  document.getElementById("serverBtn").onclick = () => {
    const s = readState();
    s.activeScope = "server";
    saveState(s);
    render();
    alert("Активна: База сервера. Витрину создадим следующим шагом.");
  };

  document.getElementById("resetBtn").onclick = () => {
    if (!confirm("Очистить новое ядро V91?")) return;
    saveState(emptyState());
    render();
  };

  if (!localStorage.getItem(STATE_KEY)) {
    saveState(emptyState());
  }

  render();
})();
</script>
</body>
</html>
