<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Electric PRO — База сервера</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
    .top{position:sticky;top:0;z-index:20;padding:10px 12px;background:#111827;color:white;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .title{font-size:16px;font-weight:900}
    .sub{font-size:11px;opacity:.72;margin-top:2px}
    .back{border:0;border-radius:12px;padding:9px 11px;background:#374151;color:#fff;font-weight:900;font-size:12px}
    .wrap{padding:12px;max-width:900px;margin:0 auto}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    button,select,input{font:inherit}
    .tab{border:0;border-radius:14px;padding:12px;background:#fff;color:#4f46e5;font-weight:900}
    .tab.active{background:#4f46e5;color:#fff}
    .panel{background:#fff;border-radius:18px;padding:10px;margin-bottom:12px;box-shadow:0 4px 16px rgba(0,0,0,.06);display:grid;gap:8px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .panel button,.panel select,.panel input{width:100%;border-radius:12px;padding:11px 9px;border:1px solid #d1d5db;font-weight:800;font-size:13px;background:#fff}
    .green{background:#059669!important;color:white!important;border:0!important}
    .blue{background:#2563eb!important;color:white!important;border:0!important}
    .red{background:#dc2626!important;color:white!important;border:0!important}
    .dark{background:#111827!important;color:white!important;border:0!important}
    .info{padding:10px 12px;border-radius:14px;background:#eef2ff;color:#3730a3;font-weight:900;font-size:13px;margin-bottom:10px}
    .cat{background:#fff;border-radius:18px;overflow:hidden;margin-bottom:10px;border:1px solid rgba(17,24,39,.08);box-shadow:0 3px 12px rgba(0,0,0,.04)}
    .catHead{width:100%;border:0;background:#ecfdf5;color:#065f46;padding:14px;font-weight:900;display:flex;justify-content:space-between;align-items:center;text-align:left}
    .subBlock{padding:10px 12px;border-top:1px solid rgba(17,24,39,.08)}
    .subTitle{font-weight:900;margin:4px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .subTitle button{border:0;border-radius:10px;padding:7px 9px;background:#2563eb;color:#fff;font-size:11px;font-weight:900}
    .item{display:grid;grid-template-columns:26px 1fr 86px 70px;gap:7px;align-items:center;padding:9px 0;border-top:1px solid rgba(17,24,39,.06)}
    .check{width:18px;height:18px}
    .name{font-size:13px;font-weight:850;color:#1f2937}
    .meta{font-size:11px;color:#6b7280;margin-top:2px}
    .price,.unit{width:100%;border:1px solid #d1d5db;border-radius:11px;padding:8px 7px;font-size:12px;font-weight:850;background:#f3f4f6;color:#4b5563}
    .empty{padding:28px 12px;text-align:center;color:#6b7280;font-weight:800}
    .small{font-size:11px;color:#6b7280;font-weight:800}
  </style>
</head>
<body>
  <div class="top">
    <div>
      <div class="title">🌍 База сервера</div>
      <div class="sub">витрина позиций · добавление в мою базу · V88</div>
    </div>
    <button class="back" id="backBtn" type="button">← Назад</button>
  </div>

  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-type="materials">Материалы</button>
      <button class="tab" data-type="works">Работы</button>
    </div>

    <div class="panel">
      <input id="search" placeholder="Поиск по базе сервера">

      <div class="row">
        <select id="catFilter"></select>
        <select id="subFilter"></select>
      </div>

      <div class="row">
        <button class="blue" id="selectVisible">Выделить видимые</button>
        <button class="dark" id="clearChecks">Снять галочки</button>
      </div>

      <div class="row">
        <button class="green" id="addSelected">+ Добавить выбранные в мою базу</button>
        <button class="green" id="addVisible">+ Добавить все видимые</button>
      </div>

      <div class="small">
        Мастер здесь только выбирает позиции. Редактирование сервера будет доступно админу отдельным режимом.
      </div>
    </div>

    <div id="info" class="info"></div>
    <div id="list"></div>
  </div>

<script>
(function(){
  const SERVER_KEYS = {
    materials: ["ep_server_db_materials_v88", "ep_server_materials_v88"],
    works: ["ep_server_db_works_v88", "ep_server_works_v88"]
  };

  const MY_KEYS = {
    materials: ["ep_my_db_materials_v83", "ep_db_my_materials_v67", "userMatDB", "EP_MY_MAT"],
    works: ["ep_my_db_works_v83", "ep_db_my_works_v67", "userWorkDB", "EP_MY_WORK"]
  };

  const $ = (id)=>document.getElementById(id);
  let active = "materials";
  let db = {materials:[], works:[]};

  function arr(v){return Array.isArray(v)?v:[]}
  function readJson(key,fallback){try{const raw=localStorage.getItem(key);if(!raw)return fallback;return JSON.parse(raw)??fallback}catch(e){return fallback}}
  function writeJson(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}}

  function firstList(keys){
    for(const key of keys){
      const list = arr(readJson(key, []));
      if(list.length) return list;
    }
    return [];
  }

  function load(){
    db.materials = normalizeList(firstList(SERVER_KEYS.materials), "material");
    db.works = normalizeList(firstList(SERVER_KEYS.works), "work");
  }

  function readMy(type){
    const keys = type === "works" ? MY_KEYS.works : MY_KEYS.materials;
    for(const key of keys){
      const list = arr(readJson(key, []));
      if(list.length) return list;
    }
    return [];
  }

  function saveMy(type, list){
    const keys = type === "works" ? MY_KEYS.works : MY_KEYS.materials;
    const normalized = normalizeList(list, type === "works" ? "work" : "material");
    keys.forEach((key)=>writeJson(key, normalized));
    return normalized;
  }

  function normalizeList(list,type){
    return arr(list).map((x)=>normalizeItem(x,type)).filter((x)=>x.name);
  }

  function normalizeItem(x,type){
    x = x && typeof x === "object" ? {...x} : {};
    const name = String(x.name || x.title || x.label || x["Наименование"] || "").trim();
    const price = Number(String(x.price ?? x.cost ?? x.amount ?? x["Цена"] ?? 0).replace(",", ".")) || 0;
    const unit = String(x.unit || x.measure || x.uom || x["Ед"] || "шт").trim() || "шт";
    const category = String(x.category || x.cat || x.group || x.section || "Другое").trim() || "Другое";
    const subcategory = String(x.subcategory || x.subcat || x.sub || x.kind || x.folder || "Без подкатегории").trim() || "Без подкатегории";
    if(!x.id) x.id = "srv_" + type + "_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    return {...x,id:String(x.id),dbType:type,name,price,unit,category,subcategory};
  }

  function getStore(){return active==="works"?db.works:db.materials}

  function catMap(){
    const map = {};
    getStore().forEach((item)=>{
      if(!map[item.category]) map[item.category] = new Set();
      map[item.category].add(item.subcategory || "Без подкатегории");
    });
    return map;
  }

  function fillFilters(){
    const map = catMap();
    const cats = Object.keys(map).sort((a,b)=>a.localeCompare(b,"ru"));
    const oldCat = $("catFilter").value;

    $("catFilter").innerHTML = '<option value="">Все категории</option>';
    cats.forEach((cat)=>{
      const opt=document.createElement("option");
      opt.value=cat; opt.textContent=cat;
      $("catFilter").appendChild(opt);
    });
    if(oldCat && cats.includes(oldCat)) $("catFilter").value = oldCat;

    fillSubFilter();
  }

  function fillSubFilter(){
    const map = catMap();
    const cat = $("catFilter").value;
    let subs = [];
    if(cat && map[cat]) subs = Array.from(map[cat]);
    else Object.values(map).forEach((set)=>subs.push(...Array.from(set)));
    subs = Array.from(new Set(subs)).filter(Boolean).sort((a,b)=>a.localeCompare(b,"ru"));

    const old = $("subFilter").value;
    $("subFilter").innerHTML = '<option value="">Все подкатегории</option>';
    subs.forEach((sub)=>{
      const opt=document.createElement("option");
      opt.value=sub; opt.textContent=sub;
      $("subFilter").appendChild(opt);
    });
    if(old && subs.includes(old)) $("subFilter").value = old;
  }

  function filteredItems(){
    const q = $("search").value.trim().toLowerCase();
    const cat = $("catFilter").value;
    const sub = $("subFilter").value;

    return getStore().filter((item)=>{
      if(q && !item.name.toLowerCase().includes(q)) return false;
      if(cat && item.category !== cat) return false;
      if(sub && item.subcategory !== sub) return false;
      return true;
    });
  }

  function group(list){
    const map = new Map();
    list.forEach((item)=>{
      if(!map.has(item.category)) map.set(item.category,new Map());
      const subMap=map.get(item.category);
      if(!subMap.has(item.subcategory)) subMap.set(item.subcategory,[]);
      subMap.get(item.subcategory).push(item);
    });
    return map;
  }

  function render(){
    fillFilters();
    const all = getStore();
    const shown = filteredItems();
    $("info").textContent = `${active==="works"?"Работы":"Материалы"} · всего: ${all.length} · показано: ${shown.length}`;

    const list = $("list");
    list.innerHTML = "";

    if(!shown.length){
      list.innerHTML = '<div class="empty">База сервера пока пустая. Открой главный экран и нажми «База сервера», затем снова эту страницу.</div>';
      return;
    }

    const grouped = group(shown);
    Array.from(grouped.keys()).sort((a,b)=>a.localeCompare(b,"ru")).forEach((cat)=>{
      const subMap = grouped.get(cat);
      const count = Array.from(subMap.values()).reduce((s,a)=>s+a.length,0);

      const box=document.createElement("div");
      box.className="cat";

      const head=document.createElement("button");
      head.className="catHead";
      head.type="button";
      head.innerHTML=`<span>${esc(cat)}</span><span>${count}</span>`;

      const content=document.createElement("div");
      content.hidden=true;

      head.onclick=()=>{
        content.hidden=!content.hidden;
        if(!content.hidden && !content.dataset.done){
          renderCatContent(content, subMap);
          content.dataset.done="1";
        }
      };

      box.appendChild(head);
      box.appendChild(content);
      list.appendChild(box);
    });
  }

  function renderCatContent(content, subMap){
    content.innerHTML = "";
    Array.from(subMap.keys()).sort((a,b)=>a.localeCompare(b,"ru")).forEach((sub)=>{
      const wrap=document.createElement("div");
      wrap.className="subBlock";

      const title=document.createElement("div");
      title.className="subTitle";
      title.innerHTML = `<span>${esc(sub)}</span><button type="button">+ всю подкатегорию</button>`;
      title.querySelector("button").onclick = () => addItems(subMap.get(sub));

      wrap.appendChild(title);
      subMap.get(sub).forEach((item)=>wrap.appendChild(renderItem(item)));
      content.appendChild(wrap);
    });
  }

  function renderItem(item){
    const row=document.createElement("div");
    row.className="item";

    const check=document.createElement("input");
    check.type="checkbox";
    check.className="check";
    check.dataset.id=item.id;

    const name=document.createElement("div");
    name.innerHTML=`<div class="name">${esc(item.name)}</div><div class="meta">${esc(item.category)} · ${esc(item.subcategory)}</div>`;

    const price=document.createElement("input");
    price.className="price";
    price.disabled=true;
    price.value=item.price;

    const unit=document.createElement("input");
    unit.className="unit";
    unit.disabled=true;
    unit.value=item.unit;

    row.appendChild(check);
    row.appendChild(name);
    row.appendChild(price);
    row.appendChild(unit);
    return row;
  }

  function visibleIds(){
    return Array.from(document.querySelectorAll(".check")).map((x)=>x.dataset.id);
  }

  function selectedIds(){
    return Array.from(document.querySelectorAll(".check:checked")).map((x)=>x.dataset.id);
  }

  function selectVisible(){
    document.querySelectorAll(".check").forEach((x)=>x.checked=true);
  }

  function clearChecks(){
    document.querySelectorAll(".check").forEach((x)=>x.checked=false);
  }

  function addSelected(){
    const ids = selectedIds();
    if(!ids.length) return alert("Сначала выбери позиции галочками");
    const items = getStore().filter((x)=>ids.includes(x.id));
    addItems(items);
  }

  function addVisible(){
    const ids = visibleIds();
    const items = getStore().filter((x)=>ids.includes(x.id));
    addItems(items);
  }

  function sig(item){
    return [String(item.name).toLowerCase().trim(), String(item.unit).toLowerCase().trim()].join("|");
  }

  function addItems(items){
    const type = active;
    const target = readMy(type);
    const existing = new Set(target.map(sig));
    let added = 0;

    items.forEach((item)=>{
      const copy = normalizeItem({...item, source:"server"}, type==="works"?"work":"material");
      const s = sig(copy);
      if(existing.has(s)) return;
      copy.id = "my_" + type + "_" + Date.now() + "_" + Math.random().toString(16).slice(2);
      target.push(copy);
      existing.add(s);
      added++;
    });

    saveMy(type, target);
    alert("Добавлено в мою базу: " + added);
  }

  function esc(v){
    return String(v??"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  document.querySelectorAll(".tab").forEach((btn)=>{
    btn.onclick=()=>{
      document.querySelectorAll(".tab").forEach((x)=>x.classList.remove("active"));
      btn.classList.add("active");
      active=btn.dataset.type;
      render();
    };
  });

  $("backBtn").onclick=()=>{
    sessionStorage.setItem("ep_return_to_database_v88","1");
    if(history.length>1) history.back();
    else location.href="index.html?v=return-from-server-db";
  };

  $("search").oninput=render;
  $("catFilter").onchange=()=>{fillSubFilter();render()};
  $("subFilter").onchange=render;
  $("selectVisible").onclick=selectVisible;
  $("clearChecks").onclick=clearChecks;
  $("addSelected").onclick=addSelected;
  $("addVisible").onclick=addVisible;

  load();
  render();
})();
</script>
</body>
</html>
