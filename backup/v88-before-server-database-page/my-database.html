<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Electric PRO — Моя база</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f3f4f6;
      color:#111827;
    }
    .top{
      position:sticky;
      top:0;
      z-index:20;
      padding:10px 12px;
      background:#111827;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .title{font-size:16px;font-weight:900}
    .sub{font-size:11px;opacity:.72;margin-top:2px}
    .back{
      border:0;
      border-radius:12px;
      padding:9px 11px;
      background:#374151;
      color:#fff;
      font-weight:900;
      text-decoration:none;
      font-size:12px;
    }
    .wrap{padding:12px;max-width:900px;margin:0 auto}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    button,select,input{
      font:inherit;
    }
    .tab{
      border:0;
      border-radius:14px;
      padding:12px;
      background:#fff;
      color:#4f46e5;
      font-weight:900;
    }
    .tab.active{background:#4f46e5;color:#fff}
    .panel{
      background:#fff;
      border-radius:18px;
      padding:10px;
      margin-bottom:12px;
      box-shadow:0 4px 16px rgba(0,0,0,.06);
      display:grid;
      gap:8px;
    }
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .panel button,.panel select,.panel input{
      width:100%;
      border-radius:12px;
      padding:11px 9px;
      border:1px solid #d1d5db;
      font-weight:800;
      font-size:13px;
      background:#fff;
    }
    .green{background:#059669!important;color:white!important;border:0!important}
    .blue{background:#2563eb!important;color:white!important;border:0!important}
    .red{background:#dc2626!important;color:white!important;border:0!important}
    .dark{background:#111827!important;color:white!important;border:0!important}
    .info{
      padding:10px 12px;
      border-radius:14px;
      background:#ecfdf5;
      color:#065f46;
      font-weight:900;
      font-size:13px;
      margin-bottom:10px;
    }
    .cat{
      background:#fff;
      border-radius:18px;
      overflow:hidden;
      margin-bottom:10px;
      border:1px solid rgba(17,24,39,.08);
      box-shadow:0 3px 12px rgba(0,0,0,.04);
    }
    .catHead{
      width:100%;
      border:0;
      background:#eef2ff;
      color:#3730a3;
      padding:14px;
      font-weight:900;
      display:flex;
      justify-content:space-between;
      align-items:center;
      text-align:left;
    }
    .subBlock{padding:10px 12px;border-top:1px solid rgba(17,24,39,.08)}
    .subTitle{font-weight:900;margin:4px 0 8px}
    .item{
      display:grid;
      grid-template-columns:26px 1fr 86px 70px;
      gap:7px;
      align-items:center;
      padding:9px 0;
      border-top:1px solid rgba(17,24,39,.06);
    }
    .check{width:18px;height:18px}
    .name{font-size:13px;font-weight:850;color:#1f2937}
    .meta{font-size:11px;color:#6b7280;margin-top:2px}
    .price,.unit{
      width:100%;
      border:1px solid #d1d5db;
      border-radius:11px;
      padding:8px 7px;
      font-size:12px;
      font-weight:850;
      background:#fff;
    }
    .empty{
      padding:28px 12px;
      text-align:center;
      color:#6b7280;
      font-weight:800;
    }
    .small{font-size:11px;color:#6b7280;font-weight:800}
  </style>
</head>
<body>
  <div class="top">
    <div>
      <div class="title">📁 Моя база</div>
      <div class="sub">личный файловый менеджер мастера · V83</div>
    </div>
    <button class="back" id="backBtn" type="button">← Назад</button>
  </div>

  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-type="materials">Материалы</button>
      <button class="tab" data-type="works">Работы</button>
    </div>

    <div class="panel">
      <input id="search" placeholder="Поиск по названию">

      <div class="row">
        <select id="catSelect"></select>
        <select id="subSelect"></select>
      </div>

      <div class="row">
        <button class="blue" id="createCat">+ Категория</button>
        <button class="blue" id="createSub">+ Подкатегория</button>
      </div>

      <div class="row">
        <button class="green" id="addItem">+ Позиция</button>
        <button class="green" id="moveSelected">Переместить выбранные</button>
      </div>

      <div class="row">
        <button class="dark" id="exportBtn">Экспорт JSON</button>
        <button class="dark" id="importBtn">Импорт JSON</button>
      </div>

      <div class="row">
        <button class="dark" id="aiBtn">ИИ импорт</button>
        <button class="red" id="deleteSelected">Удалить выбранные</button>
      </div>

      <button class="red" id="clearDb">Очистить мою базу</button>

      <input type="file" id="fileInput" accept=".json,application/json" hidden>
      <div class="small">Excel, фото и ИИ-импорт подключим следующим шагом, здесь уже готово место под них.</div>
    </div>

    <div id="info" class="info"></div>
    <div id="list"></div>
  </div>

<script>
(function(){
  const KEYS = {
    mat: [
      "ep_my_db_materials_v83",
      "ep_db_my_materials_v79",
      "ep_db_my_materials_v67"
    ],
    work: [
      "ep_my_db_works_v83",
      "ep_db_my_works_v79",
      "ep_db_my_works_v67"
    ],
    cats: "ep_my_db_categories_v83",
    cleared: "ep_my_db_cleared_v83"
  };

  const preset = {};

  let active = "materials";
  let db = { materials: [], works: [] };

  const $ = (id) => document.getElementById(id);

  function readJson(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return fallback;
      return JSON.parse(raw) ?? fallback;
    }catch(e){ return fallback; }
  }

  function writeJson(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }

  function arr(v){ return Array.isArray(v) ? v : []; }

  function firstList(keys){
    const cleared = localStorage.getItem(KEYS.cleared);
    for(const key of keys){
      const list = arr(readJson(key, []));
      if(list.length) return list;
      if(cleared && key !== keys[0]) continue;
    }
    return arr(readJson(keys[0], []));
  }

  function load(){
    db.materials = normalizeList(firstList(KEYS.mat), "material");
    db.works = normalizeList(firstList(KEYS.work), "work");
    save();
  }

  function save(){
    const mats = normalizeList(db.materials, "material");
    const works = normalizeList(db.works, "work");

    db.materials = mats;
    db.works = works;

    for(const key of KEYS.mat) writeJson(key, mats);
    for(const key of KEYS.work) writeJson(key, works);

    // Совместимость со старым приложением
    writeJson("userMatDB", mats);
    writeJson("userWorkDB", works);
    writeJson("EP_MY_MAT", mats);
    writeJson("EP_MY_WORK", works);
  }

  function normalizeList(list, type){
    return arr(list).map((x) => normalizeItem(x, type)).filter((x) => x.name);
  }

  function normalizeItem(x, type){
    x = x && typeof x === "object" ? {...x} : {};

    const name = String(x.name || x.title || x.label || x["Наименование"] || "").trim();
    const price = Number(String(x.price ?? x.cost ?? x.amount ?? x["Цена"] ?? 0).replace(",", ".")) || 0;
    const unit = String(x.unit || x.measure || x.uom || x["Ед"] || "шт").trim() || "шт";
    const category = String(x.category || x.cat || x.group || x.section || x.type || "Другое").trim() || "Другое";
    const subcategory = String(x.subcategory || x.subcat || x.sub || x.kind || x.folder || "Без подкатегории").trim() || "Без подкатегории";

    if(!x.id){
      x.id = "my_" + type + "_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    }

    return {
      ...x,
      id: String(x.id),
      dbType: type,
      name,
      price,
      unit,
      category,
      subcategory,
      updatedAt: Date.now()
    };
  }

  function getStore(){
    return active === "works" ? db.works : db.materials;
  }

  function setStore(list){
    if(active === "works") db.works = list;
    else db.materials = list;
    save();
  }

  function catMap(){
    const saved = readJson(KEYS.cats, {});
    const map = {};

    for(const cat of Object.keys(preset)){
      map[cat] = new Set(preset[cat]);
    }

    for(const cat of Object.keys(saved || {})){
      if(!map[cat]) map[cat] = new Set();
      arr(saved[cat]).forEach((sub) => sub && map[cat].add(String(sub)));
    }

    [...db.materials, ...db.works].forEach((item) => {
      if(!map[item.category]) map[item.category] = new Set();
      if(item.subcategory) map[item.category].add(item.subcategory);
    });

    return map;
  }

  function saveCatMap(map){
    const plain = {};
    Object.keys(map).forEach((cat) => {
      plain[cat] = Array.from(map[cat]).filter(Boolean);
    });
    writeJson(KEYS.cats, plain);
  }

  function fillSelects(){
    const map = catMap();
    const cats = Object.keys(map).sort((a,b)=>a.localeCompare(b,"ru"));
    const oldCat = $("catSelect").value;

    $("catSelect").innerHTML = '<option value="">Категория</option>';
    cats.forEach((cat) => {
      const opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      $("catSelect").appendChild(opt);
    });

    if(oldCat && cats.includes(oldCat)) $("catSelect").value = oldCat;

    fillSubSelect();
  }

  function fillSubSelect(){
    const map = catMap();
    const cat = $("catSelect").value;
    let subs = cat && map[cat] ? Array.from(map[cat]) : ["Без подкатегории"];
    subs = subs.filter(Boolean).sort((a,b)=>a.localeCompare(b,"ru"));
    if(!subs.length) subs = ["Без подкатегории"];

    const old = $("subSelect").value;
    $("subSelect").innerHTML = '<option value="">Подкатегория</option>';
    subs.forEach((sub) => {
      const opt = document.createElement("option");
      opt.value = sub;
      opt.textContent = sub;
      $("subSelect").appendChild(opt);
    });
    if(old && subs.includes(old)) $("subSelect").value = old;
  }

  function group(list){
    const map = new Map();
    list.forEach((item) => {
      if(!map.has(item.category)) map.set(item.category, new Map());
      const subMap = map.get(item.category);
      if(!subMap.has(item.subcategory)) subMap.set(item.subcategory, []);
      subMap.get(item.subcategory).push(item);
    });
    return map;
  }

  function render(){
    fillSelects();

    const store = getStore();
    const q = $("search").value.trim().toLowerCase();
    const filtered = q ? store.filter((x) => x.name.toLowerCase().includes(q)) : store;

    $("info").textContent = `${active === "works" ? "Работы" : "Материалы"} · позиций: ${store.length}`;

    const list = $("list");
    list.innerHTML = "";

    if(!filtered.length){
      list.innerHTML = '<div class="empty">Пока пусто. Добавь позиции из базы сервера или импортируй файл.</div>';
      return;
    }

    const grouped = group(filtered);

    Array.from(grouped.keys()).sort((a,b)=>a.localeCompare(b,"ru")).forEach((cat) => {
      const subMap = grouped.get(cat);
      const count = Array.from(subMap.values()).reduce((s,a)=>s+a.length,0);

      const box = document.createElement("div");
      box.className = "cat";

      const head = document.createElement("button");
      head.className = "catHead";
      head.type = "button";
      head.innerHTML = `<span>${esc(cat)}</span><span>${count}</span>`;

      const content = document.createElement("div");
      content.hidden = true;

      head.onclick = () => {
        content.hidden = !content.hidden;
        if(!content.hidden && !content.dataset.done){
          renderCatContent(content, subMap);
          content.dataset.done = "1";
        }
      };

      box.appendChild(head);
      box.appendChild(content);
      list.appendChild(box);
    });
  }

  function renderCatContent(content, subMap){
    content.innerHTML = "";

    Array.from(subMap.keys()).sort((a,b)=>a.localeCompare(b,"ru")).forEach((sub) => {
      const wrap = document.createElement("div");
      wrap.className = "subBlock";

      const title = document.createElement("div");
      title.className = "subTitle";
      title.textContent = sub;
      wrap.appendChild(title);

      subMap.get(sub).forEach((item) => wrap.appendChild(renderItem(item)));
      content.appendChild(wrap);
    });
  }

  function renderItem(item){
    const row = document.createElement("div");
    row.className = "item";

    const check = document.createElement("input");
    check.type = "checkbox";
    check.className = "check";
    check.dataset.id = item.id;

    const name = document.createElement("div");
    name.innerHTML = `<div class="name">${esc(item.name)}</div><div class="meta">${esc(item.category)} · ${esc(item.subcategory)}</div>`;

    const price = document.createElement("input");
    price.className = "price";
    price.type = "number";
    price.value = item.price;

    const unit = document.createElement("select");
    unit.className = "unit";
    ["ед","м.п","м","упк","шт"].forEach((u) => {
      const opt = document.createElement("option");
      opt.value = u;
      opt.textContent = u;
      unit.appendChild(opt);
    });
    unit.value = item.unit;

    price.onchange = () => {
      item.price = Number(String(price.value || 0).replace(",", ".")) || 0;
      item.updatedAt = Date.now();
      save();
    };

    unit.onchange = () => {
      item.unit = unit.value;
      item.updatedAt = Date.now();
      save();
    };

    row.appendChild(check);
    row.appendChild(name);
    row.appendChild(price);
    row.appendChild(unit);

    return row;
  }

  function selectedIds(){
    return Array.from(document.querySelectorAll(".check:checked")).map((x)=>x.dataset.id);
  }

  function moveSelected(){
    const ids = selectedIds();
    const cat = $("catSelect").value;
    const sub = $("subSelect").value || "Без подкатегории";

    if(!ids.length) return alert("Сначала выбери позиции галочками");
    if(!cat) return alert("Выбери категорию");

    const store = getStore();
    let moved = 0;

    store.forEach((item) => {
      if(ids.includes(item.id)){
        item.category = cat;
        item.subcategory = sub;
        item.updatedAt = Date.now();
        moved++;
      }
    });

    save();
    alert("Перемещено: " + moved);
    render();
  }

  function deleteSelected(){
    const ids = selectedIds();
    if(!ids.length) return alert("Сначала выбери позиции галочками");
    if(!confirm("Удалить выбранные позиции?")) return;

    const before = getStore().length;
    setStore(getStore().filter((x)=>!ids.includes(x.id)));
    alert("Удалено: " + (before - getStore().length));
    render();
  }

  function addItem(){
    const name = prompt("Название позиции:");
    if(!name) return;

    const price = prompt("Цена:", "0") || "0";
    const unit = prompt("Единица: ед / м.п / м / упк / шт", "шт") || "шт";
    const cat = $("catSelect").value || prompt("Категория:", "Другое") || "Другое";
    const sub = $("subSelect").value || prompt("Подкатегория:", "Без подкатегории") || "Без подкатегории";

    const item = normalizeItem({name, price, unit, category:cat, subcategory:sub}, active === "works" ? "work" : "material");
    const store = getStore();
    store.push(item);
    setStore(store);
    render();
  }

  function createCat(){
    const cat = prompt("Название категории:");
    if(!cat) return;

    const map = catMap();
    if(!map[cat]) map[cat] = new Set(["Без подкатегории"]);
    saveCatMap(map);
    fillSelects();
    $("catSelect").value = cat;
    fillSubSelect();
  }

  function createSub(){
    const cat = $("catSelect").value || prompt("К какой категории добавить?");
    if(!cat) return;

    const sub = prompt("Название подкатегории:");
    if(!sub) return;

    const map = catMap();
    if(!map[cat]) map[cat] = new Set();
    map[cat].add(sub);
    saveCatMap(map);
    $("catSelect").value = cat;
    fillSubSelect();
    $("subSelect").value = sub;
  }

  function exportJson(){
    const data = {
      version: "V83",
      exportedAt: new Date().toISOString(),
      materials: db.materials,
      works: db.works,
      categories: readJson(KEYS.cats, {})
    };

    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "electric-pro-my-database.json";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function importJsonFile(file){
    const reader = new FileReader();

    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        const mats = Array.isArray(data) ? data : arr(data.materials);
        const works = Array.isArray(data.works) ? data.works : [];

        db.materials = merge(db.materials, normalizeList(mats, "material"));
        db.works = merge(db.works, normalizeList(works, "work"));

        if(data.categories) writeJson(KEYS.cats, data.categories);

        save();
        render();
        alert("Импорт завершён");
      }catch(e){
        alert("Не получилось импортировать JSON");
      }
    };

    reader.readAsText(file);
  }

  function merge(a,b){
    const map = new Map();
    [...arr(a), ...arr(b)].forEach((item) => {
      const key = (item.name || "").toLowerCase() + "|" + item.unit + "|" + item.price;
      map.set(key, item);
    });
    return Array.from(map.values());
  }

  function clearDb(){
    if(!confirm("Очистить всю мою базу?")) return;

    db.materials = [];
    db.works = [];

    localStorage.setItem(KEYS.cleared, String(Date.now()));

    [...KEYS.mat, ...KEYS.work, "userMatDB", "userWorkDB", "EP_MY_MAT", "EP_MY_WORK"].forEach((key) => {
      writeJson(key, []);
    });

    save();
    render();
    alert("Моя база очищена");
  }

  function esc(v){
    return String(v ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  document.querySelectorAll(".tab").forEach((btn) => {
    btn.onclick = () => {
      document.querySelectorAll(".tab").forEach((x)=>x.classList.remove("active"));
      btn.classList.add("active");
      active = btn.dataset.type;
      render();
    };
  });

  $("search").oninput = render;
  $("catSelect").onchange = fillSubSelect;
  $("moveSelected").onclick = moveSelected;
  $("deleteSelected").onclick = deleteSelected;
  $("addItem").onclick = addItem;
  $("createCat").onclick = createCat;
  $("createSub").onclick = createSub;
  $("exportBtn").onclick = exportJson;
  $("importBtn").onclick = () => $("fileInput").click();
  $("fileInput").onchange = (e) => e.target.files[0] && importJsonFile(e.target.files[0]);
  $("clearDb").onclick = clearDb;
  $("aiBtn").onclick = () => alert("ИИ-импорт подключим следующим шагом: фото, Excel, текст, скриншоты.");

  
  $("backBtn").onclick = () => {
    sessionStorage.setItem("ep_return_to_database_v87", "1");
    if (history.length > 1) history.back();
    else location.href = "index.html?v=return-to-database";
  };

  load();
  render();
})();
</script>
</body>
</html>
