# Деплой в Firebase (hosting + rules + functions) при пуше в main.
# Требуется секрет FIREBASE_SERVICE_ACCOUNT — JSON сервисного аккаунта
# с ролями Firebase Admin + Cloud Functions Admin (см. docs/DEPLOY.md).
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        run: npm ci --prefix functions || npm install --prefix functions

      - name: Syntax check
        run: |
          node --check functions/index.js
          node --check sw.js
          find assets/js -name '*.js' -exec node --check {} \;
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Run tests (gate before deploy)
        run: node test/run.js

      - name: Bump cache-busting version (?v=NNNN во всех ассетах + имя кэша SW)
        run: |
          node scripts/bump-cache-version.js
          node --check sw.js
          node --check assets/js/core/router.js

      # Деплой РАЗДЕЛЁН на два шага СПЕЦИАЛЬНО: раньше hosting, rules и functions шли
      # одной командой, и любая проблема с функцией (промах по региону триггера, ошибка
      # в рантайме сборки, недоступный API) валила шаг ЦЕЛИКОМ — приложение не
      # выкатывалось вообще, хотя к самому приложению это не имело отношения. Теперь
      # сначала уезжает то, что видит пользователь, и только потом функции; падение
      # функций по-прежнему красит сборку красным (мы об этом узнаем), но уже НЕ
      # блокирует выкат приложения.
      - name: Deploy hosting + rules
        uses: w9jds/firebase-action@v13.35.1
        with:
          args: deploy --only hosting,firestore:rules --force --non-interactive
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: electric-489f7

      - name: Deploy functions
        uses: w9jds/firebase-action@v13.35.1
        with:
          args: deploy --only functions --force --non-interactive
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: electric-489f7
