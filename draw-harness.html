<script>
  window.EP = window.EP || {};
  EP.state = { user: { uid: "u1", displayName: "Мастер Тест" } };
  EP.Auth = { isAdmin: () => true, user: () => EP.state.user };
  EP.Firebase = { db: null };
  EP.Router = { load: () => {}, current: () => "plan" };
  // подставное облако с тем же контрактом, что cloud-store.js
  window.__cloud = { docs: {}, on: true };
  EP.Cloud = {
    isReady: () => !!window.__cloud.on,
    push: (n, d) => { window.__cloud.docs[n] = JSON.parse(JSON.stringify(d)); return Promise.resolve(true); },
    pull: (n) => Promise.resolve(window.__cloud.docs[n] ? JSON.parse(JSON.stringify(window.__cloud.docs[n])) : null),
    onLogin: () => {}
  };
</script>
